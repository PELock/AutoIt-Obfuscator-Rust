[package]
name = "autoit-obfuscator"
version = "1.5.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "AutoIt Obfuscator Web API interface can help you to protect your AutoIt script source code against analysis, reverse engineering and decompilation."
authors = ["Bartosz Wójcik <support@pelock.com>"]
readme = "README.md"
repository = "https://github.com/PELock/AutoIt-Obfuscator-Rust"
homepage = "https://www.pelock.com/products/autoit-obfuscator"
documentation = "https://docs.rs/autoit-obfuscator"
keywords = ["autoit", "obfuscator", "obfuscation", "au3", "protection"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.22"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "multipart",
    "json",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }

[package.metadata.docs.rs]
all-features = true
